plugins { id 'com.android.application' }
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
tasks.configureEach {
    if (name.contains('Emulator') && name.endsWith('GoogleServices')) { enabled = false }
}

android {
    namespace 'vn.edu.studentmanager'
    compileSdk 36
    defaultConfig {
        applicationId 'vn.edu.studentmanager'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'FUNCTIONS_REGION', '"asia-southeast1"'
    }
    flavorDimensions += 'environment'
    productFlavors {
        emulator {
            dimension 'environment'
            applicationIdSuffix '.emulator'
            buildConfigField 'boolean', 'USE_EMULATORS', 'true'
            buildConfigField 'String', 'EMULATOR_HOST', '"10.0.2.2"'
        }
        production {
            dimension 'environment'
            buildConfigField 'boolean', 'USE_EMULATORS', 'false'
            buildConfigField 'String', 'EMULATOR_HOST', '""'
        }
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
